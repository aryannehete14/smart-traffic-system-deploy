spring.application.name=project

# =========================================================
# RAILWAY DATABASE CONFIGURATION
# =========================================================

# The URL using the Railway Internal Host (or Public Host if you prefer)
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway

# The actual username (usually root)
spring.datasource.username=root

# The actual password (NO ${} brackets here!)
spring.datasource.password=xVHBBOKTwexihDJujfpWYbYtgpYzpmoM

# =========================================================
# SYSTEM SETTINGS
# =========================================================

# Driver and Hibernate Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Critical for Deployment: Tells Spring to use the port Railway assigns,
# or default to 8080 if running locally.
server.port=${PORT:8080}